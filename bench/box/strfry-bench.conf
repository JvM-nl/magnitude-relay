##
## strfry, benchmark instance (second, separate process; the production relay is untouched).
## Template: the live /root/strfry/strfry.conf, read-only. Every key is present because
## strfry refuses a config that omits one. Lines marked BENCH differ from the live file.
##

# BENCH: own database, never the production one
db = "/root/bench/strfry-db/"

dbParams {
    maxreaders = 256
    mapsize = 10995116277760
    noReadAhead = true
}

events {
    maxEventSize = 65536
    rejectEventsNewerThanSeconds = 900
    # NOTE: left at the live value (3 years). Events dated older than this are refused,
    # unlike our relay (no lower bound) and ditto/fastr. Seed benchmark data newer than this.
    rejectEventsOlderThanSeconds = 94608000
    rejectEphemeralEventsOlderThanSeconds = 60
    ephemeralEventsLifetimeSeconds = 300
    maxNumTags = 2000
    maxTagValSize = 1024
}

relay {
    # BENCH: loopback only, port in the 7801-7809 benchmark range
    bind = "127.0.0.1"
    port = 7803

    nofiles = 524288

    # BENCH: no reverse proxy in front, so no forwarded-for header is honoured
    realIpHeader = ""

    info {
        name = "strfry-bench"
        description = "strfry benchmark instance"
        pubkey = ""
        contact = ""
        icon = ""
        nips = ""
    }

    # BENCH: 256 KiB, matching our relay's max_message_bytes (live: 131072)
    maxWebsocketPayloadSize = 262144

    # BENCH: 50, matching our relay's max_filters (live: 20)
    maxReqFilterSize = 50

    autoPingSeconds = 55
    enableTcpKeepalive = true
    queryTimesliceBudgetMicroseconds = 10000

    # BENCH: 5000, matching our relay's max_limit (live: 500)
    maxFilterLimit = 5000

    # BENCH: 200, matching our relay's max_subscriptions (live: 20)
    maxSubsPerConnection = 200

    writePolicy {
        plugin = ""

        # BENCH: nothing refused (live refuses kinds 1, 3, 6, 7, 16, ...), to match
        # our relay's `kinds = "all"`
        rejectedKinds = ""
    }

    auth {
        # NIP-42 stays available (as on the other relays). `enabled = false` is NOT used:
        # the live config documents that it leaves kind 1059/4 permanently unreadable in
        # this build, because the default read restriction stays and AUTH can never
        # satisfy it. The kinds list is the control.
        enabled = true

        # BENCH: no kind needs AUTH to read, so gift wraps (1059) and DMs (4) are readable
        # by #p and by authors without authenticating. Same as the live config.
        restrictedReadKinds = ""
    }

    compression {
        # BENCH: off, to match the other relays under test (live: on)
        enabled = false
        slidingWindow = true
    }

    logging {
        dumpInAll = false
        dumpInEvents = false
        dumpInReqs = false
        dbScanPerf = false
        invalidEvents = true
    }

    numThreads {
        ingester = 3
        reqWorker = 3
        reqMonitor = 3
        negentropy = 2
    }

    negentropy {
        enabled = true
        maxSyncEvents = 1000000
    }
}
