[package]
name = "relay-server"
description = "The relay binary"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# The product name: change it here and in src/brand.rs.
[[bin]]
name = "magnitude-relay"
path = "src/main.rs"

[dependencies]
relay-proto.workspace = true
relay-store.workspace = true
# tls: wss:// to other relays, for sync.
relay-net = { workspace = true, features = ["tls"] }
relay-tls.workspace = true
tokio.workspace = true

[dev-dependencies]
# The in-process ACME server and a TLS client, for the end-to-end HTTPS tests.
relay-tls = { workspace = true, features = ["testing"] }
rustls.workspace = true
tokio-rustls.workspace = true
negentropy = { version = "0.5", default-features = false, features = ["std"] }
secp256k1.workspace = true
sha2.workspace = true
serde_json.workspace = true
base64.workspace = true
