[package]
name = "relay-net"
description = "HTTP/1.1 upgrade and RFC 6455 WebSocket: a sans-IO core plus thin tokio helpers"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# wss:// for the client side (connector.rs): rustls with the ring provider,
# trusting webpki-roots. Off by default; only the relay's sync needs it.
tls = ["dep:rustls", "dep:tokio-rustls", "dep:webpki-roots"]

[dependencies]
tokio.workspace = true
rustls = { workspace = true, optional = true }
tokio-rustls = { workspace = true, optional = true }
webpki-roots = { workspace = true, optional = true }

[dev-dependencies]
# Reference codec for tests and the benchmark example only: our own DEFLATE is
# cross-checked against it in both directions and compared for speed and ratio.
# Never a runtime dependency.
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }
