[package]
name = "relay-adversarial-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

# Coverage-guided fuzzing of the same targets the stable runner (`adv fuzz`)
# uses, with libFuzzer: needs a nightly toolchain and cargo-fuzz, so it runs
# on the box only (scripts/box-fuzz.sh). One binary per target.
[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
relay-adversarial = { path = ".." }

[workspace]
members = ["."]

[profile.release]
debug = 1
overflow-checks = true
debug-assertions = true

[[bin]]
name = "json"
path = "fuzz_targets/json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "canonical"
path = "fuzz_targets/canonical.rs"
test = false
doc = false
bench = false

